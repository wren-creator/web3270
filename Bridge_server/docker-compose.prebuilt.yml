# WebTerm/3270 — run from prebuilt images (no clone, no build, no Node).
name: web3270
#
#   docker compose -f docker-compose.prebuilt.yml up -d
#   open http://localhost:8081
#
# Images come from ghcr.io/wren-creator/web3270-*. Pin a release instead of
# tracking latest:   WEB3270_TAG=1.0.0 docker compose -f docker-compose.prebuilt.yml up -d
# Different host port:  BRIDGE_HOST_PORT=9000 docker compose -f ... up -d
#
# Offline? `docker load < web3270-images-<version>-<arch>.tar.gz` first. Compose
# uses the loaded images and only pulls what is missing.
#
# Your own LPARs added in the UI are saved inside the bridge container. They
# survive stop/start/restart, but NOT `docker compose down`. To keep them across
# down/up, create lpars.txt and ssh-hosts.txt next to this file (empty files are
# fine, they MUST exist as files or Docker makes directories) and uncomment the
# two bind mounts below.

services:
  tn3270-bridge:
    image: ${REGISTRY:-ghcr.io/wren-creator}/web3270-bridge:${WEB3270_TAG:-latest}
    container_name: tn3270-bridge
    restart: unless-stopped
    ports:
      - "${BRIDGE_HOST_PORT:-8081}:8081"
    volumes:
      - macros_data:/app/macros/local
      # - ./lpars.txt:/app/lpars.txt
      # - ./ssh-hosts.txt:/app/ssh-hosts.txt
    environment:
      BRIDGE_PORT: "8081"
      MACRO_RUN_API_KEY: "${MACRO_RUN_API_KEY:-}"
      LOG_LEVEL: "info"
      # "false" accepts self-signed mainframe certs. Set "true" if yours is CA-signed.
      BRIDGE_VERIFY_TLS: "false"
      BRIDGE_SOCKET_TIMEOUT_MS: "300000"
      BRIDGE_MAX_SESSIONS: "50"
      DEFAULT_MODEL: "3278-2"
      DEFAULT_CODEPAGE: "37"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mock-lpar
      - mock-zvm
      - mock-tpf
      - mock-as400
      - mock-claims
    networks: [tn3270-net]

  mock-lpar:
    image: ${REGISTRY:-ghcr.io/wren-creator}/web3270-mock-lpar:${WEB3270_TAG:-latest}
    container_name: mock-lpar
    restart: unless-stopped
    environment: { MOCK_PORT: "3270", MOCK_SYSID: "DEMOSYS", MOCK_LU: "MOCKLU01", LOG_LEVEL: "info" }
    networks: [tn3270-net]

  mock-zvm:
    image: ${REGISTRY:-ghcr.io/wren-creator}/web3270-mock-zvm:${WEB3270_TAG:-latest}
    container_name: mock-zvm
    restart: unless-stopped
    environment: { MOCK_ZVM_PORT: "3271", MOCK_ZVM_SYSID: "ZVMPROD", MOCK_ZVM_VMID: "ZVMSYS1", MOCK_ZVM_LU: "ZVMLU01", LOG_LEVEL: "info" }
    networks: [tn3270-net]

  mock-tpf:
    image: ${REGISTRY:-ghcr.io/wren-creator}/web3270-mock-tpf:${WEB3270_TAG:-latest}
    container_name: mock-tpf
    restart: unless-stopped
    environment: { MOCK_PORT: "3274", MOCK_SYSID: "TPFSYS1", MOCK_LU: "TPFLU01", LOG_LEVEL: "info" }
    networks: [tn3270-net]

  mock-as400:
    image: ${REGISTRY:-ghcr.io/wren-creator}/web3270-mock-as400:${WEB3270_TAG:-latest}
    container_name: mock-as400
    restart: unless-stopped
    environment: { MOCK_AS400_PORT: "3272", MOCK_AS400_SYSID: "AS400MOCK", LOG_LEVEL: "info" }
    networks: [tn3270-net]

  mock-claims:
    image: ${REGISTRY:-ghcr.io/wren-creator}/web3270-mock-claims:${WEB3270_TAG:-latest}
    container_name: mock-claims
    restart: unless-stopped
    environment: { MOCK_CLAIMS_PORT: "3273", MOCK_CLAIMS_SYSID: "CLAIMSYS", MOCK_CLAIMS_LU: "CLAIMLU1", LOG_LEVEL: "info" }
    networks: [tn3270-net]

networks:
  tn3270-net:
    driver: bridge

volumes:
  macros_data:
