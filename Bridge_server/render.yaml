# Render Blueprint for the hosted webterm-3270.com deployment.
# ─────────────────────────────────────────────────────────────────
# This deploys the multi-tenant paid product — separate from the
# internal/OpenShift deployment (openshift/), which has no account
# system and stays on the shared security-tools password. See
# docs/render-deploy.md for the setup walkthrough (connecting this
# repo, filling in the manual secrets below, running the first DB
# migration, and pointing webterm-3270.com's DNS at this service).
#
# All paths here are relative to this file, not the git repo root —
# when creating the Blueprint in Render, point it at
# Bridge_server/render.yaml.

databases:
  - name: webterm3270-db
    # Render retired the legacy "starter" Postgres plan name; basic-256mb
    # is the current closest equivalent (smallest paid tier).
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  # ── Main bridge — the only publicly reachable service ────────────
  - type: web
    name: webterm3270-bridge
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    disk:
      name: webterm3270-macros
      # Only macros/accounts/ needs a disk — session/SSH profiles are
      # Postgres-backed per account (db/session-profiles.js,
      # db/ssh-host-profiles.js) as of the multi-tenant isolation
      # work, so lpars.txt/ssh-hosts.txt need no persistence here.
      mountPath: /app/macros/accounts
      sizeGB: 1
    envVars:
      - key: BRIDGE_MULTI_TENANT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: webterm3270-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Set to the real domain once DNS is pointed at this service —
      # PayPal's return_url/cancel_url and the webhook receiver both
      # depend on this being correct.
      - key: PUBLIC_BASE_URL
        value: https://webterm-3270.com

      # ── PayPal — fill in from the PayPal developer dashboard ──────
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PLAN_ID_BASE
        sync: false
      - key: PAYPAL_PLAN_ID_TRAINING
        sync: false
      - key: PAYPAL_PLAN_ID_FULL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_LIVE_CLIENT_ID
        sync: false
      - key: PAYPAL_LIVE_CLIENT_SECRET
        sync: false
      - key: PAYPAL_LIVE_PLAN_ID_BASE
        sync: false
      - key: PAYPAL_LIVE_PLAN_ID_TRAINING
        sync: false
      - key: PAYPAL_LIVE_PLAN_ID_FULL
        sync: false
      - key: PAYPAL_LIVE_WEBHOOK_ID
        sync: false

      # ── Telnyx (signup phone OTP) ──────────────────────────────────
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_FROM_NUMBER
        sync: false

      # ── SMTP (email verification + full-tier disclaimer notify) ───
      - key: SMTP_HOST
        value: smtp.forwardemail.net
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false

  # ── Mock LPARs — private services, not publicly reachable ─────────
  # Reachable from the main bridge over Render's private network by
  # service name (matching lpars.shipped.txt's hostnames exactly —
  # mock-lpar, mock-zvm, mock-tpf, mock-as400, mock-claims — so this
  # needs no application code changes vs. the docker-compose setup).
  # Verify this resolves after first deploy; Render's private
  # networking details are worth confirming against current docs.
  - type: pserv
    name: mock-lpar
    runtime: docker
    dockerfilePath: ./mock-lpar/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: MOCK_PORT
        value: "3270"
      - key: MOCK_SYSID
        value: DEMOSYS
      - key: MOCK_LU
        value: MOCKLU01

  - type: pserv
    name: mock-zvm
    runtime: docker
    dockerfilePath: ./mock-lpar/Dockerfile.mock-zvm
    dockerContext: .
    plan: starter
    envVars:
      - key: MOCK_ZVM_PORT
        value: "3271"
      - key: MOCK_ZVM_SYSID
        value: ZVMPROD
      - key: MOCK_ZVM_VMID
        value: ZVMSYS1
      - key: MOCK_ZVM_LU
        value: ZVMLU01

  - type: pserv
    name: mock-tpf
    runtime: docker
    dockerfilePath: ./mock-lpar/Dockerfile.mock-tpf
    dockerContext: .
    plan: starter
    envVars:
      - key: MOCK_PORT
        value: "3274"
      - key: MOCK_SYSID
        value: TPFSYS1
      - key: MOCK_LU
        value: TPFLU01

  - type: pserv
    name: mock-as400
    runtime: docker
    dockerfilePath: ./mock-lpar/Dockerfile.mock-as400
    dockerContext: .
    plan: starter
    envVars:
      - key: MOCK_AS400_PORT
        value: "3272"
      - key: MOCK_AS400_SYSID
        value: AS400MOCK

  - type: pserv
    name: mock-claims
    runtime: docker
    dockerfilePath: ./mock-lpar/Dockerfile.mock-claims
    dockerContext: .
    plan: starter
    envVars:
      - key: MOCK_CLAIMS_PORT
        value: "3273"
      - key: MOCK_CLAIMS_SYSID
        value: CLAIMSYS
      - key: MOCK_CLAIMS_LU
        value: CLAIMLU1
